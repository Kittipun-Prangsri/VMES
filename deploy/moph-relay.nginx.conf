# Relay สำหรับ MOPH ID token — วางบนเซิร์ฟเวอร์ในไทยที่มี HTTPS และเข้าถึงได้จากอินเทอร์เน็ต
# (moph.id.th ไม่รับการเชื่อมต่อจาก IP นอกประเทศไทย จึงเรียกจาก Vercel ตรงๆ ไม่ได้)
#
# ใส่ใน server { listen 443 ssl; ... } ของโดเมนที่มีอยู่ แล้วตั้งบน Vercel:
#   MOPH_TOKEN_RELAY_URL=https://<โดเมนนี้>/vmes-moph-token
#   MOPH_RELAY_KEY=<ค่าเดียวกับ CHANGE_ME ด้านล่าง>
# สร้างค่าลับ: openssl rand -hex 32
#
# relay นี้ส่งต่อได้เฉพาะ POST ไปที่ /api/v1/token และต้องมี X-Relay-Key ที่ถูกต้อง

location = /vmes-moph-token {
    if ($http_x_relay_key != "CHANGE_ME") { return 403; }
    limit_except POST { deny all; }

    proxy_set_header X-Relay-Key "";
    proxy_set_header Host moph.id.th;
    proxy_ssl_server_name on;
    proxy_ssl_name moph.id.th;
    proxy_connect_timeout 10s;
    proxy_read_timeout 15s;
    proxy_pass https://moph.id.th/api/v1/token;
}
